apiVersion: v1
kind: ConfigMap
metadata:
  name: carteros-config
  namespace: carteros
data:
  APP_NAME: carter-os
  APP_VERSION: "1.0.0"
  ENVIRONMENT: development
  DEBUG: "false"
  HOST: "0.0.0.0"
  PORT: "8000"
  RELOAD: "true"
  POSTGRES_HOST: postgres
  POSTGRES_CONTAINER_PORT: "5432"
  REDIS_HOST: redis
  REDIS_CONTAINER_PORT: "6379"
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "10"
  DB_POOL_TIMEOUT: "30"
  DB_POOL_RECYCLE: "1800"
  REDIS_MAX_CONNECTIONS: "50"
  CACHE_DEFAULT_TTL: "300"
  CACHE_VERSION: v1
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  RATE_LIMIT_DEFAULT: 100/minute
  RATE_LIMIT_AUTH: 20/minute
  LOG_LEVEL: DEBUG
  LOG_JSON_FORMAT: "false"
  VITE_API_URL: /api
  VITE_APP_TITLE: CarterOS
