apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  namespace: mongodb
  labels:
    app: mongodb
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - port: 27017
      name: mongodb
  publishNotReadyAddresses: true
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-0-external
  namespace: mongodb
  labels:
    app: mongodb
    role: primary
spec:
  type: NodePort
  selector:
    app: mongodb
    statefulset.kubernetes.io/pod-name: mongodb-0
  ports:
    - port: 27017
      targetPort: 27017
      nodePort: 31010
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-1-external
  namespace: mongodb
  labels:
    app: mongodb
    role: secondary
spec:
  type: NodePort
  selector:
    app: mongodb
    statefulset.kubernetes.io/pod-name: mongodb-1
  ports:
    - port: 27017
      targetPort: 27017
      nodePort: 31012
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-2-external
  namespace: mongodb
  labels:
    app: mongodb
    role: secondary
spec:
  type: NodePort
  selector:
    app: mongodb
    statefulset.kubernetes.io/pod-name: mongodb-2
  ports:
    - port: 27017
      targetPort: 27017
      nodePort: 31013
