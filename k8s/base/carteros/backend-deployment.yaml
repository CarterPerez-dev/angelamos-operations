apiVersion: apps/v1
kind: Deployment
metadata:
  name: carteros-backend
  namespace: carteros
  labels:
    app: carteros-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carteros-backend
  template:
    metadata:
      labels:
        app: carteros-backend
    spec:
      hostAliases:
        - ip: "192.168.1.183"
          hostnames:
            - "docker-host"
      containers:
        - name: fastapi
          image: carteros-backend:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: carteros-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carteros-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: carteros-secrets
                  key: POSTGRES_DB
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carteros-secrets
                  key: REDIS_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: carteros-secrets
                  key: SECRET_KEY
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - name: REDIS_URL
              value: "redis://redis:6379"
          envFrom:
            - configMapRef:
                name: carteros-config
          volumeMounts:
            - name: app-code
              mountPath: /app
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: app-code
          hostPath:
            path: /home/yoshi/dev/operations/angelamos-operations/CarterOS-Server
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: carteros-backend
  namespace: carteros
  labels:
    app: carteros-backend
spec:
  selector:
    app: carteros-backend
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: carteros-backend-external
  namespace: carteros
  labels:
    app: carteros-backend
spec:
  type: NodePort
  selector:
    app: carteros-backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30420
      name: http
